version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  ai-analyzer:
    build: ./ai
    ports:
      - "5200:5200"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    volumes:
      - ai_data:/data

  coordinator:
    build: ./coordinator
    ports:
      - "5000:5000"
    environment:
      - NODE_URLS=http://node1:5100,http://node2:5100,http://node3:5100
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
      - node1
      - node2
      - node3
    volumes:
      - coordinator_data:/data

  node1:
    build: ./node
    ports:
      - "5101:5100"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_URL=http://node1:5100
    depends_on:
      - redis
    volumes:
      - node1_data:/data

  node2:
    build: ./node
    ports:
      - "5102:5100"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_URL=http://node2:5100
    depends_on:
      - redis
    volumes:
      - node2_data:/data

  node3:
    build: ./node
    ports:
      - "5103:5100"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_URL=http://node3:5100
    depends_on:
      - redis
    volumes:
      - node3_data:/data

volumes:
  coordinator_data:
  node1_data:
  node2_data:
  node3_data:
  ai_data:
